name: priscy_store
description: Priscy Luxury Slippers — Flutter Web Storefront & Admin Dashboard powered by Supabase and Paystack Mobile Money.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  supabase_flutter: ^2.6.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
